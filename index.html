<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>EaglecraftX 1.8.8</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            touch-action: none;

            -webkit-user-select: none;
            user-select: none;

            -webkit-touch-callout: none;
        }

        body {
            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            overscroll-behavior: none;
        }

        #game {
            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #000;

            touch-action: none;
        }

        #game canvas {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;

            outline: none;
            border: none;

            touch-action: none;

            image-rendering: auto;
        }

        /*
         * iPad control bar
         */

        #ipadControls {
            position: fixed;

            top: max(
                10px,
                env(safe-area-inset-top)
            );

            right: max(
                10px,
                env(safe-area-inset-right)
            );

            z-index: 10000;

            display: flex;

            gap: 6px;

            padding: 6px;

            border-radius: 10px;

            background: rgba(0, 0, 0, 0.65);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        #ipadControls button {
            appearance: none;
            -webkit-appearance: none;

            border: 0;

            padding: 8px 10px;

            border-radius: 7px;

            background: rgba(255, 255, 255, 0.15);

            color: #fff;

            font-family: Arial, sans-serif;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            white-space: nowrap;
        }

        #ipadControls button:active {
            background: rgba(255, 255, 255, 0.30);

            transform: scale(0.96);
        }

        /*
         * File inputs are hidden.
         * Clicking the buttons opens the iPad Files picker.
         */

        #skinInput,
        #texturePackInput {
            display: none;
        }

        /*
         * Loading screen
         */

        #loading {
            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            z-index: 9000;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background: #000;

            color: #fff;

            font-family: Arial, sans-serif;

            text-align: center;
        }

        #loadingTitle {
            font-size: 25px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        #loadingText {
            font-size: 14px;

            opacity: 0.75;
        }

        /*
         * Hide iPad buttons when the game
         * enters fullscreen.
         */

        :fullscreen #ipadControls {
            top: max(
                10px,
                env(safe-area-inset-top)
            );
        }

        /*
         * Prevent text selection and browser
         * gestures while playing.
         */

        button,
        canvas {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>

<body>

    <!--
        Main Eaglercraft game container
    -->

    <div id="game"></div>


    <!--
        iPad-specific controls
    -->

    <div id="ipadControls">

        <button
            id="fullscreenButton"
            type="button"
        >
            Fullscreen
        </button>

        <button
            id="skinButton"
            type="button"
        >
            Skin
        </button>

        <button
            id="texturePackButton"
            type="button"
        >
            Texture Pack
        </button>

    </div>


    <!--
        iPad Files app inputs
    -->

    <input
        id="skinInput"
        type="file"
        accept="image/png,.png"
    >

    <input
        id="texturePackInput"
        type="file"
        accept=".zip,application/zip,application/x-zip-compressed"
    >


    <!--
        Loading screen
    -->

    <div id="loading">

        <div id="loadingTitle">
            EaglecraftX 1.8.8
        </div>

        <div id="loadingText">
            Loading client...
        </div>

    </div>


    <!--
        iPad compatibility / import system
    -->

    <script src="ipad-client.js"></script>


    <!--
        IMPORTANT:

        The actual compiled EaglercraftX 1.8.8
        client needs to be loaded here.

        The filename will depend on the build
        produced by the EaglercraftX source.
    -->


    <script>
        "use strict";

        /*
         * Fullscreen
         */

        document
            .getElementById("fullscreenButton")
            .addEventListener("click", function () {

                const element = document.documentElement;

                if (element.requestFullscreen) {

                    element
                        .requestFullscreen()
                        .catch(function () {});

                } else if (
                    element.webkitRequestFullscreen
                ) {

                    element.webkitRequestFullscreen();
                }

            });


        /*
         * Skin importer
         */

        document
            .getElementById("skinButton")
            .addEventListener("click", function () {

                document
                    .getElementById("skinInput")
                    .click();

            });


        /*
         * Texture-pack importer
         */

        document
            .getElementById("texturePackButton")
            .addEventListener("click", function () {

                document
                    .getElementById("texturePackInput")
                    .click();

            });


        /*
         * Skin file selected
         */

        document
            .getElementById("skinInput")
            .addEventListener("change", function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }

                if (
                    file.type !== "image/png" &&
                    !file.name
                        .toLowerCase()
                        .endsWith(".png")
                ) {

                    alert(
                        "Please select a PNG skin."
                    );

                    return;
                }

                const reader =
                    new FileReader();

                reader.onload = function () {

                    try {

                        localStorage.setItem(
                            "EaglecraftX_Skin",
                            reader.result
                        );

                        localStorage.setItem(
                            "EaglecraftX_Skin_Name",
                            file.name
                        );

                        alert(
                            "Skin imported successfully!"
                        );

                    } catch (error) {

                        console.error(error);

                        alert(
                            "Could not save the skin."
                        );
                    }
                };

                reader.readAsDataURL(file);

            });


        /*
         * Texture pack selected
         */

        document
            .getElementById("texturePackInput")
            .addEventListener("change", function () {

                const file = this.files[0];

                if (!file) {
                    return;
                }

                if (
                    !file.name
                        .toLowerCase()
                        .endsWith(".zip")
                ) {

                    alert(
                        "Please select a .zip texture pack."
                    );

                    return;
                }

                const reader =
                    new FileReader();

                reader.onload = function () {

                    try {

                        const bytes =
                            new Uint8Array(
                                reader.result
                            );

                        let binary = "";

                        const chunkSize = 8192;

                        for (
                            let i = 0;
                            i < bytes.length;
                            i += chunkSize
                        ) {

                            const chunk =
                                bytes.subarray(
                                    i,
                                    Math.min(
                                        i + chunkSize,
                                        bytes.length
                                    )
                                );

                            binary += String.fromCharCode(
                                ...chunk
                            );
                        }

                        const encoded =
                            btoa(binary);

                        localStorage.setItem(
                            "EaglecraftX_TexturePack",
                            encoded
                        );

                        localStorage.setItem(
                            "EaglecraftX_TexturePack_Name",
                            file.name
                        );

                        alert(
                            "Texture pack imported successfully!"
                        );

                    } catch (error) {

                        console.error(error);

                        alert(
                            "Could not save this texture pack. " +
                            "It may be too large."
                        );
                    }

                };

                reader.readAsArrayBuffer(file);

            });


        /*
         * Prevent Safari gestures while playing.
         */

        document.addEventListener(
            "gesturestart",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gesturechange",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gestureend",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );


        /*
         * Prevent page scrolling.
         */

        document.addEventListener(
            "touchmove",
            function (event) {

                if (
                    event.target.tagName !== "INPUT"
                ) {
                    event.preventDefault();
                }

            },
            {
                passive: false
            }
        );


        /*
         * Keep the game viewport correct when
         * iPad orientation/size changes.
         */

        function resizeGame() {

            const game =
                document.getElementById("game");

            game.style.width =
                window.innerWidth + "px";

            game.style.height =
                window.innerHeight + "px";
        }

        window.addEventListener(
            "resize",
            resizeGame
        );

        window.addEventListener(
            "orientationchange",
            function () {

                setTimeout(
                    resizeGame,
                    100
                );

            }
        );

        resizeGame();


        /*
         * Remove loading screen once the page
         * has finished loading.
         *
         * The actual Eaglercraft build can also
         * remove it when its renderer starts.
         */

        window.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        const loading =
                            document.getElementById(
                                "loading"
                            );

                        if (loading) {

                            loading.style.display =
                                "none";
                        }

                    },
                    1000
                );

            }
        );

    </script>

</body>
</html>
